services:
  db:
    image: mariadb:10.11
    container_name: nube-db
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    volumes:
      - db_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/db_root_password
      - MYSQL_PASSWORD_FILE=/run/secrets/db_password
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
    secrets:
      - db_root_password
      - db_password
    networks:
      - nube
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$(cat /run/secrets/db_root_password) | grep 'mysqld is alive'"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nube-redis
    restart: unless-stopped
    networks:
      - nube
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  nextcloud:
    image: nextcloud:stable-apache
    container_name: nube-nextcloud
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - nextcloud_data:/var/www/html
      - ./custom_apps:/var/www/html/custom_apps
      - ./hsts.conf:/etc/apache2/conf-enabled/hsts.conf:ro
    environment:
      - MYSQL_PASSWORD_FILE=/run/secrets/db_password
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_HOST=db
      - NEXTCLOUD_ADMIN_USER=alex
      - NEXTCLOUD_ADMIN_PASSWORD_FILE=/run/secrets/admin_password
      - NEXTCLOUD_TRUSTED_DOMAINS=nube.bentomo.es nube-nextcloud
      - OVERWRITEPROTOCOL=https
      - OVERWRITEHOST=nube.bentomo.es
      - OVERWRITECONDITION=^https://
      - TRUSTED_PROXIES=172.0.0.0/8 192.0.0.0/8 10.0.0.0/8 192.168.0.0/16
      - REDIS_HOST=redis
      - REDIS_HOST_PORT=6379
    secrets:
      - admin_password
      - db_password
    networks:
      - nube
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/status.php"]
      interval: 10s
      timeout: 5s
      retries: 20

  eurooffice:
    image: ghcr.io/euro-office/documentserver:latest
    container_name: nube-eurooffice
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - eurooffice_data:/var/www/euro-office/Data
    environment:
      - JWT_ENABLED=true
      - USE_EXTERNAL_PROXY=true
      - ALLOW_META_IP_ADDRESS=true
      - ALLOW_PRIVATE_IP_ADDRESS=true
    networks:
      - nube
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  nextcloud_data:
  eurooffice_data:

networks:
  nube:
    name: nube

secrets:
  admin_password:
    file: ./secrets/admin_password.txt
  db_password:
    file: ./secrets/db_password.txt
  db_root_password:
    file: ./secrets/db_root_password.txt
  eurooffice_jwt:
    file: ./secrets/eurooffice_jwt.txt
